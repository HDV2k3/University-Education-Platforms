name: Deploy UEP API to VPS

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: docker build -f UNIVERSITY.EDUCATION.PLATFORMS/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/university-platforms:latest .

    - name: Push image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/university-platforms:latest

    - name: Push image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/university-platforms:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.VPS_HOST }}
        username: root
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
          cd /var/www/uep
          docker pull ${{ secrets.DOCKER_USERNAME }}/university-platforms:latest
          docker-compose down
          docker-compose up -d
