name: Deploy UEP API to VPS

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -f UNIVERSITY.EDUCATION.PLATFORMS/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/university-platforms:latest .

      - name: Push image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/university-platforms:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to VPS safely with rollback
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e

            cd /var/www/uep

            echo "📌 Pull latest image"
            docker pull ${{ secrets.DOCKER_USERNAME }}/university-platforms:latest

            echo "📌 Run new API in a temporary container"
            docker run --name uep-api-temp -d -p 8081:8080 \
              --env-file .env \
              --network uep_default \
              ${{ secrets.DOCKER_USERNAME }}/university-platforms:latest

            echo "📌 Waiting healthcheck..."
            sleep 8

            if ! curl -f http://localhost:8081/health ; then
              echo "❌ New version failed → ROLLBACK"
              docker rm -f uep-api-temp
              exit 1
            fi

            echo "✔ New version healthy → Deployment continues"
            docker rm -f uep-api-temp

            echo "📌 Restart docker-compose without DOWN"
            docker-compose pull
            docker-compose up -d --force-recreate

            echo "🚀 Deployment successful"
