name: Deploy UEP API to VPS

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -f UNIVERSITY.EDUCATION.PLATFORMS/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/university-platforms:latest .

      - name: Push image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/university-platforms:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to VPS with rollback
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            cd /var/www/uep

            echo "Create network if missing"
            docker network inspect uep-network >/dev/null 2>&1 || docker network create uep-network

            echo "Pull latest API image"
            docker pull ${{ secrets.DOCKER_USERNAME }}/university-platforms:latest

            echo "Start temporary API container"
            docker rm -f uep-api-temp 2>/dev/null || true
            docker run --name uep-api-temp -d \
              --env-file .env \
              --network uep-network \
              -p 8081:8080 \
              ${{ secrets.DOCKER_USERNAME }}/university-platforms:latest

            echo "Waiting for API health..."
            for i in {1..15}; do
              if curl -fs http://localhost:8081/health > /dev/null; then
                echo "✔ HEALTH OK"
                break
              fi
              echo "Waiting ($i/15)..."
              sleep 3
            done

            if ! curl -fs http://localhost:8081/health > /dev/null; then
              echo "New API FAILED — ROLLBACK"
              docker rm -f uep-api-temp
              exit 1
            fi

            echo "✔ New version healthy → Proceeding to deploy"
            docker rm -f uep-api-temp

            echo "Deploy API only (zero downtime)"
            docker-compose pull api || docker compose pull api
            docker-compose up -d --no-deps --force-recreate api || docker compose up -d --no-deps --force-recreate api

            echo "Deployment SUCCESSFUL"
